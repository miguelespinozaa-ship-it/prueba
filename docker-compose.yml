version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_customer_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloud_eats_users
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
  adminer:
    image: adminer
    container_name: adminer_gui
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    
  
  ms-customer:
    build: .
    container_name: ms_customer_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=cloud_eats_users
      - DB_PORT=3306
      - JWT_SECRET=cloudeats_super_secret_key_2026
    depends_on:
      - db

volumes:
  mysql_data:
